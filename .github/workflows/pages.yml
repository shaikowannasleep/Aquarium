name: Build portfolio pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild Aquarium artwork
        working-directory: apps/aquarium
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          node tools/bake-svg.js "$GH_USER"
          node tools/build-pages.js "$GH_USER"
          cp docs/aquarium.svg ../../docs/apps/aquarium/aquarium.svg
          cp docs/index.html ../../docs/apps/aquarium/index.html

      - name: Build Abyssal Dive
        working-directory: apps/abyssal-dive
        run: |
          node build.js
          cp dist/index.html ../../docs/apps/abyssal-dive/index.html

      - name: Build Lumen
        working-directory: apps/lumen-playable
        run: |
          node build.js
          cp dist/index.html ../../docs/apps/lumen-playable/index.html

      - name: Build Gà Rán & Bơ Già Dừa Non
        working-directory: apps/ga-ran-bo-gia-dua-non
        run: |
          npm ci
          node build.js
          mkdir -p ../../docs/apps/ga-ran-bo-gia-dua-non
          cp dist/index.html ../../docs/apps/ga-ran-bo-gia-dua-non/index.html

      - name: Validate portfolio and demo builds
        run: npm run test:ci

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
