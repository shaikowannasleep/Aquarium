<!DOCTYPE html>
<html lang="en">

<title>LUMEN — Playable</title>
<style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;overflow:hidden;background:#03060f;font-family:"Trebuchet MS",Verdana,system-ui,sans-serif;user-select:none;touch-action:none}#stage{position:fixed;inset:0;display:block}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}#ui{position:fixed;inset:0;pointer-events:none;color:#eaf6ff}/* ---------------- HUD ---------------- */#hud{position:absolute;top:0;left:0;right:0;padding:14px 16px;display:flex;align-items:flex-start;justify-content:space-between;text-shadow:0 2px 10px rgba(0,0,0,.8)}#beat{font-size:11px;letter-spacing:.26em;opacity:.62;text-transform:uppercase}#obj{font-size:16px;font-weight:700;letter-spacing:.04em;margin-top:3px}#meter{width:132px;height:7px;margin-top:8px;border-radius:99px;background:rgba(255,255,255,.13);overflow:hidden}#meterFill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#3fe0d0,#7af5a8);box-shadow:0 0 14px #3fe0d0;transition:width .18s ease-out}#right{text-align:right}#count{font-size:26px;font-weight:800;letter-spacing:.02em;line-height:1}#countLbl{font-size:9px;letter-spacing:.22em;opacity:.5;margin-top:3px}/* ---------------- toast ---------------- */#toast{position:absolute;left:50%;top:26%;transform:translate(-50%,-50%) scale(.9);text-align:center;opacity:0;transition:opacity .4s,transform .4s;width:86%}#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}#toastT{font-size:30px;font-weight:800;letter-spacing:.06em;text-shadow:0 0 28px rgba(80,220,255,.65)}#toastS{font-size:13px;opacity:.72;margin-top:7px;letter-spacing:.05em}/* ---------------- hand hint ---------------- */#hand{position:absolute;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;border:2px solid rgba(255,255,255,.85);box-shadow:0 0 22px rgba(120,235,255,.8),inset 0 0 16px rgba(120,235,255,.45);opacity:0;transition:opacity .35s}#hand.on{opacity:.95}#hand::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:2px solid rgba(140,240,255,.5);animation:pulse 1.5s infinite}@keyframes pulse{0%{transform:scale(.72);opacity:1}100%{transform:scale(1.35);opacity:0}}/* ---------------- end card ---------------- */#end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(circle at 50% 42%,rgba(10,30,60,.72),rgba(2,5,14,.94));opacity:0;pointer-events:none;transition:opacity .5s}#end.on{opacity:1;pointer-events:auto}#logo{font-size:50px;font-weight:900;letter-spacing:.2em;background:linear-gradient(180deg,#eafcff,#49d8ff 60%,#1f7fd0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 26px rgba(70,200,255,.6))}#tag{font-size:13px;letter-spacing:.16em;opacity:.75;text-align:center;padding:0 24px}#stats{font-size:11px;letter-spacing:.1em;opacity:.6;text-align:center;line-height:1.8}#cta{margin-top:10px;padding:16px 46px;border-radius:99px;border:0;cursor:pointer;font-size:18px;font-weight:800;letter-spacing:.13em;color:#05131f;background:linear-gradient(180deg,#8df7dd,#25c9b4);box-shadow:0 10px 34px rgba(45,220,200,.45);animation:breathe 1.7s ease-in-out infinite}@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}#replay{font-size:11px;letter-spacing:.18em;opacity:.5;cursor:pointer;text-decoration:underline;pointer-events:auto}/* ---------------- tech overlay ---------------- */#techBtn{position:absolute;right:12px;bottom:12px;pointer-events:auto;cursor:pointer;font-size:9px;letter-spacing:.2em;padding:8px 12px;border-radius:8px;border:1px solid rgba(120,220,255,.35);color:#8fe4ff;background:rgba(8,20,38,.65);backdrop-filter:blur(4px)}#techBtn.on{background:#8fe4ff;color:#05131f}#tech{position:absolute;left:12px;bottom:12px;width:246px;padding:11px 13px;border-radius:10px;border:1px solid rgba(120,220,255,.25);background:rgba(5,14,28,.84);backdrop-filter:blur(6px);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;line-height:1.68;color:#a8e9ff;display:none}#tech.on{display:block}#tech b{color:#fff;font-weight:700}#tech .k{display:inline-block;width:118px;opacity:.62}#tech hr{border:0;border-top:1px solid rgba(120,220,255,.18);margin:7px 0}.sl{display:flex;align-items:center;gap:7px;margin:3px 0}.sl span{width:46px;opacity:.62}.sl input{flex:1;height:3px;accent-color:#49d8ff}.sl i{width:34px;text-align:right;font-style:normal;color:#fff}</style>
</head>

    for (let i = 0; i < 6; i++) {
      const x = ((i * 0.19 + this.time * 0.012) % 1.2 - 0.1) * W;
      g.beginPath();
      g.moveTo(x, -20); g.lineTo(x + 70, -20);
      g.lineTo(x + 190, H + 20); g.lineTo(x + 40, H + 20);
      g.closePath(); g.fill();
    }
    g.globalAlpha = 1;
    if (this.beat === 0) this.drawSanctuary(g);
    if (this.beat === 1) { this.drawGate(g); this.drawObstacles(g); }
    this.drawLure(g);
    this.drawSwarm(g);
    if (this.beat === 2) this.drawPredator(g);
    this.drawParticles(g);
    if (this.showTech) this.drawDebugVectors(g);
    if (this.flash > 0.01) {
      g.globalAlpha = this.flash * 0.35;
      g.fillStyle = '#bff4ff';
      g.fillRect(-30, -30, W + 60, H + 60);
      g.globalAlpha = 1;
    }
    g.restore();
    if (this.showTech) this.updateTechPanel();
  }
  drawSanctuary(g) {
    const S = this.sanctuary;
    const pulse = 1 + Math.sin(this.time * 2) * 0.04;
    const gr = g.createRadialGradient(S.x, S.y, 4, S.x, S.y, S.r * pulse);
    gr.addColorStop(0, 'rgba(90,255,210,0.20)');
    gr.addColorStop(0.7, 'rgba(60,210,190,0.07)');
    gr.addColorStop(1, 'rgba(60,210,190,0)');
    g.fillStyle = gr;
    g.beginPath(); g.arc(S.x, S.y, S.r * pulse, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(120,255,220,0.45)';
    g.lineWidth = 1.5; g.setLineDash([6, 9]);
    g.lineDashOffset = -this.time * 22;
    g.beginPath(); g.arc(S.x, S.y, S.r, 0, TAU); g.stroke();
    g.setLineDash([]);
  }
  drawGate(g) {
    const G = this.gate;
    const gr = g.createRadialGradient(G.x, G.y, 6, G.x, G.y, G.r);
    gr.addColorStop(0, 'rgba(120,255,190,0.22)');
    gr.addColorStop(1, 'rgba(120,255,190,0)');
    g.fillStyle = gr;
    g.beginPath(); g.arc(G.x, G.y, G.r, 0, TAU); g.fill();
  }
  drawObstacles(g) {
    for (const o of this.world.obstacles) {
      if (Sprites.draw(g, 'reef', o.x, o.y, o.r * 2.1, o.spin, 0.88)) continue;
      g.save();
      g.translate(o.x, o.y); g.rotate(o.spin);
      const gr = g.createRadialGradient(0, -o.r * 0.3, 4, 0, 0, o.r);
      gr.addColorStop(0, '#2a4468');
      gr.addColorStop(1, '#0c1a2e');
      g.fillStyle = gr;
      g.beginPath();
      for (let k = 0; k < 9; k++) {
        const a = (k / 9) * TAU;
        const rr = o.r * (0.86 + ((k * 37) % 11) / 46);
        const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
        k ? g.lineTo(px, py) : g.moveTo(px, py);
      }
      g.closePath(); g.fill();
      g.strokeStyle = 'rgba(130,200,255,0.22)';
      g.lineWidth = 1.2; g.stroke();
      g.restore();
    }
  }
  drawLure(g) {
    const L = this.world.lure;
    if (L.power < 0.03) return;
    const R = this.sw.p.rLure * L.power;
    const gr = g.createRadialGradient(L.x, L.y, 2, L.x, L.y, R);
    gr.addColorStop(0, 'rgba(200,250,255,' + (0.5 * L.power).toFixed(3) + ')');
    gr.addColorStop(0.25, 'rgba(90,215,255,' + (0.16 * L.power).toFixed(3) + ')');
    gr.addColorStop(1, 'rgba(60,180,255,0)');
    g.fillStyle = gr;
    g.beginPath(); g.arc(L.x, L.y, R, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(190,245,255,' + (0.30 * L.power).toFixed(3) + ')';
    g.lineWidth = 1;
    g.beginPath();
    g.arc(L.x, L.y, 16 + Math.sin(this.time * 4) * 3, 0, TAU);
    g.stroke();
  }
  drawSwarm(g) {
    const sw = this.sw, n = sw.n;
    g.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const x = sw.px[i], y = sw.py[i];
      const st = sw.stress[i];
      const vx = sw.vx[i], vy = sw.vy[i];
      const sp = Math.hypot(vx, vy) || 1;
      const dx = vx / sp, dy = vy / sp;
      const hue = lerp(188, 32, st);
      const lit = lerp(62, 74, st);
      g.strokeStyle = 'hsla(' + hue + ',95%,' + lit + '%,0.30)';
      g.lineWidth = 2.1;
      g.beginPath();
      g.moveTo(sw.tx[i], sw.ty[i]);
      g.lineTo(x, y);
      g.stroke();
      if (vx > 10) this.fishFacing[i] = -1;
      else if (vx < -10) this.fishFacing[i] = 1;
      if (!Sprites.drawSideSprite(g, 'school', x, y, 26, vx, vy, this.fishFacing[i] === -1 ? -1 : 1, 0.95)) {
        const wig = Math.sin(sw.phase[i]) * 3.1;
        const nx = -dy, ny = dx;
        g.fillStyle = 'hsla(' + hue + ',96%,' + lit + '%,0.95)';
        g.beginPath();
        g.moveTo(x + dx * 7.5, y + dy * 7.5);
        g.lineTo(x + nx * 3.0 - dx * 3.5, y + ny * 3.0 - dy * 3.5);
        g.lineTo(x - dx * 6 + nx * wig, y - dy * 6 + ny * wig);
        g.lineTo(x - nx * 3.0 - dx * 3.5, y - ny * 3.0 - dy * 3.5);
        g.closePath(); g.fill();
      }
    }
    g.globalCompositeOperation = 'lighter';
    g.globalAlpha = 0.14;
    for (let i = 0; i < n; i += 3) {
      const hue = lerp(188, 32, sw.stress[i]);
      g.fillStyle = 'hsl(' + hue + ',100%,60%)';
      g.beginPath(); g.arc(sw.px[i], sw.py[i], 7, 0, TAU); g.fill();
    }
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
  }
  drawPredator(g) {
    const P = this.world.predators[0];
    if (!P) return;
    const speed = Math.hypot(P.vx, P.vy) || 1;
    const dx = P.vx / speed;
    if (P.facing === undefined) P.facing = 1;
    if (dx > 0.14) P.facing = -1;
    else if (dx < -0.14) P.facing = 1;
    g.save();
    g.translate(P.x, P.y);
    const gr = g.createRadialGradient(0, 0, 4, 0, 0, 90);
    gr.addColorStop(0, 'rgba(255,80,60,0.24)');
    gr.addColorStop(1, 'rgba(255,60,40,0)');
    g.fillStyle = gr;
    g.beginPath(); g.arc(0, 0, 90, 0, TAU); g.fill();
    if (!Sprites.drawSideSprite(g, 'predator', 0, 0, 86, P.vx, P.vy, P.facing === -1 ? -1 : 1, 1)) {
      g.fillStyle = '#16212f';
      g.beginPath();
      g.moveTo(34, 0); g.lineTo(2, 13); g.lineTo(-26, 6);
      g.lineTo(-34, 17); g.lineTo(-20, 0); g.lineTo(-34, -17);
      g.lineTo(-26, -6); g.lineTo(2, -13);
      g.closePath(); g.fill();
      g.strokeStyle = 'rgba(255,120,90,0.65)';
      g.lineWidth = 1.4; g.stroke();
      g.fillStyle = '#ff6a4a';
      g.beginPath(); g.arc(14, -4, 2.6, 0, TAU); g.fill();
    }
    g.restore();
  }
  drawParticles(g) {
    g.globalCompositeOperation = 'lighter';
    for (const p of this.particles) {
      const a = 1 - p.t / p.life;
      g.fillStyle = 'hsla(' + p.hue + ',100%,65%,' + (a * 0.75).toFixed(3) + ')';
      g.beginPath(); g.arc(p.x, p.y, 2.4 * a + 0.6, 0, TAU); g.fill();
    }
    g.globalCompositeOperation = 'source-over';
  }
  drawDebugVectors(g) {
    const sw = this.sw;
    const i = sw.debugIndex;
    if (i >= sw.n) return;
    const x = sw.px[i], y = sw.py[i], d = sw.dbg;
    const K = 0.34;
    g.save();
    g.lineWidth = 2;
    const arrow = (vx, vy, col) => {
      const m = Math.hypot(vx, vy);
      if (m < 1) return;
      const ex = x + vx * K, ey = y + vy * K;
      g.strokeStyle = col;
      g.beginPath(); g.moveTo(x, y); g.lineTo(ex, ey); g.stroke();
      const a = Math.atan2(vy, vx);
      g.fillStyle = col;
      g.beginPath();
      g.moveTo(ex, ey);
      g.lineTo(ex - Math.cos(a - 0.4) * 7, ey - Math.sin(a - 0.4) * 7);
      g.lineTo(ex - Math.cos(a + 0.4) * 7, ey - Math.sin(a + 0.4) * 7);
      g.closePath(); g.fill();
    };
    arrow(d.sx, d.sy, '#ff5d7a');
    arrow(d.ax, d.ay, '#7dff9b');
    arrow(d.cx, d.cy, '#69c7ff');
    g.setLineDash([3, 5]);
    g.lineWidth = 1;
    g.strokeStyle = 'rgba(255,93,122,0.5)';
    g.beginPath(); g.arc(x, y, sw.p.rSep, 0, TAU); g.stroke();
    g.strokeStyle = 'rgba(105,199,255,0.4)';
    g.beginPath(); g.arc(x, y, sw.p.rCoh, 0, TAU); g.stroke();
    g.setLineDash([]);
    g.restore();
  }
  updateTechPanel() {
    const s = this.sw.stat, sw = this.sw;
    const naive = sw.n * sw.n;
    const saved = naive > 0 ? (1 - s.neighbourTests / naive) * 100 : 0;
    document.getElementById('tAgents').textContent = sw.n;
    document.getElementById('tFps').textContent = this.fps.toFixed(0);
    document.getElementById('tSim').textContent = s.simMs.toFixed(2) + ' ms';
    document.getElementById('tGrid').textContent = s.gridMs.toFixed(2) + ' ms';
    document.getElementById('tTests').textContent = s.neighbourTests.toLocaleString();
    document.getElementById('tNaive').textContent =
      naive.toLocaleString() + '  (−' + saved.toFixed(1) + '%)';
    document.getElementById('tCells').textContent =
      s.occupied + ' / ' + (sw.cols * sw.rows);
    document.getElementById('tPol').textContent = sw.polarisation().toFixed(3);
    document.getElementById('tNb').textContent = sw.dbg.count;
  }
}
window.addEventListener('load', () => { window.GAME = new Game(document.getElementById('stage')); });
})();</script>
