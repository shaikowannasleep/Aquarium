<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Comrade, Act Normal</title>
<style>
:root{--olive:#3d4230;--olive2:#2a2e21;--paper:#e6dcc0;--paper2:#d8ccaa;--ink:#2a2620;--red:#8a2a1e;--cream:#efe6cc}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--olive:#3d4230}}
:root[data-theme="dark"]{--olive:#3d4230}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#111;color:var(--cream);font-family:Georgia,'Times New Roman',serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--olive2);color:var(--cream);font-size:20px;letter-spacing:2px;z-index:50}
#hud{display:none;position:fixed;inset:0;pointer-events:none;z-index:5}
#ret{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:rgba(240,230,205,.75);transition:all .12s}
#ret.on{width:18px;height:18px;margin:-9px 0 0 -9px;background:transparent;border:2px solid rgba(240,230,205,.85)}
#acts{position:absolute;left:50%;top:calc(50% + 22px);transform:translateX(-50%);text-align:center;font-size:14px;text-shadow:0 1px 3px #000}
.act{margin:3px 0;white-space:nowrap}
.key{display:inline-block;min-width:18px;padding:0 5px;margin-right:6px;border:1px solid rgba(240,230,205,.7);border-radius:3px;font-family:'Courier New',monospace;font-size:12px;background:rgba(20,20,15,.55)}
#obj{position:absolute;left:18px;top:16px;max-width:min(440px,70vw);background:rgba(230,220,192,.92);color:var(--ink);padding:8px 12px 9px;border-left:4px solid var(--red);box-shadow:0 2px 8px rgba(0,0,0,.4);transition:opacity .8s,transform .3s;font-size:14px}
#obj.dim{opacity:.55}#obj.flash{transform:scale(1.04)}
#obj .lbl{font-family:'Courier New',monospace;font-size:10px;letter-spacing:3px;color:var(--red)}
#subs{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);width:min(820px,90vw);text-align:center}
.sub{display:block;width:fit-content;margin:3px auto;padding:4px 12px;background:rgba(15,15,10,.62);font-size:15px;line-height:1.35;border-radius:2px}
.sub b{color:#e8c890}
#toast{position:absolute;left:50%;top:64%;transform:translateX(-50%);font-size:14px;opacity:0;transition:opacity .4s;text-shadow:0 1px 3px #000;font-style:italic;text-align:center;max-width:80vw}
#hint{position:absolute;left:50%;top:84px;transform:translateX(-50%);font-size:14px;opacity:0;transition:opacity .6s;background:rgba(61,66,48,.8);padding:6px 12px;border:1px solid rgba(239,230,204,.3);max-width:80vw;text-align:center}
#radio{position:absolute;right:18px;top:16px;max-width:340px;font-family:'Courier New',monospace;font-size:12px;opacity:0;transition:opacity .6s;background:rgba(15,15,10,.6);padding:8px 10px;border-left:3px solid #8a7a3a}
#held{position:absolute;right:18px;bottom:18px;text-align:right;font-size:13px;text-shadow:0 1px 3px #000}
#held .pk span{margin-left:10px}#held .hand{margin-bottom:5px}
#status{position:absolute;left:18px;bottom:18px;font-size:13px;font-style:italic;color:#e8d8a8;text-shadow:0 1px 3px #000}
#lockinfo{display:none;position:fixed;left:50%;top:40%;transform:translateX(-50%);z-index:6;font-size:14px;background:rgba(20,20,15,.6);padding:6px 12px;pointer-events:none}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column}
#card .ch{font-family:'Courier New',monospace;letter-spacing:6px;color:#b8a878;text-align:center}#card .cht{font-size:42px;color:var(--cream);margin-top:8px;text-align:center}
.paper{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,92vw);max-height:90vh;overflow:auto;background:linear-gradient(180deg,var(--paper),var(--paper2));color:var(--ink);padding:26px 30px;box-shadow:0 10px 40px rgba(0,0,0,.6);z-index:30;border:1px solid #b8aa88}
.paper.big{display:block;width:min(620px,92vw)}
.paper h1{font-size:44px;line-height:1.02;margin:12px 0 6px;letter-spacing:1px;color:var(--olive2)}
.paper h2{margin:0 0 12px;letter-spacing:3px;color:var(--olive2)}.paper h3{margin:14px 0 4px;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--red)}
.hdr{font-family:'Courier New',monospace;font-size:11px;letter-spacing:2px;color:#5a5240;border-bottom:1px solid #a89870;padding-bottom:6px}
.sub2{font-style:italic;color:#4a4232}
.stamp{position:absolute;right:22px;top:26px;transform:rotate(12deg);border:3px solid var(--red);color:var(--red);font-family:'Courier New',monospace;font-weight:bold;padding:2px 8px;letter-spacing:3px;opacity:.75}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 10px}.btns.col{flex-direction:column}
button{font-family:Georgia,serif;font-size:16px;background:var(--olive);color:var(--cream);border:1px solid #1e2118;padding:9px 16px;cursor:pointer;letter-spacing:1px}
button:hover{background:var(--red)}button:disabled{opacity:.45;cursor:not-allowed;background:var(--olive)}
.small{font-size:12px;color:#5a5240}.foot{margin-top:10px}
#hud .small{color:#d8ccaa}
label{display:block;margin:10px 0}label input[type=range]{width:100%}label.row input{margin-right:8px}
select{font-family:Georgia,serif;font-size:14px;margin-left:8px}
.notebook{background:repeating-linear-gradient(180deg,#e9e0c6 0 26px,#cfc3a0 26px 27px);width:min(680px,94vw)}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.tab{padding:5px 10px;background:#cfc3a0;cursor:pointer;font-size:13px}.tab.on{background:var(--olive);color:var(--cream)}
.ink{font-size:17px;color:#1e2a4a;font-style:italic}
#journal ul,#journal ol{padding-left:20px}#journal li{margin:5px 0}
#ending{display:none;position:fixed;inset:0;z-index:25;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse at center,rgba(0,0,0,.15),rgba(0,0,0,.75));text-align:center}
.etitle{font-size:clamp(34px,7vw,82px);letter-spacing:6px;color:var(--cream);text-shadow:0 0 30px #000;animation:fin 3s ease}
@keyframes fin{from{opacity:0;letter-spacing:20px}to{opacity:1}}
#ending .small{color:#c8bc98;margin-top:10px}
#debug{display:none;position:fixed;left:8px;top:110px;z-index:40;margin:0;padding:8px;background:rgba(0,0,0,.72);color:#9f9;font:11px/1.35 'Courier New',monospace;max-width:96vw;white-space:pre;overflow:auto;max-height:80vh;pointer-events:none}
</style>
