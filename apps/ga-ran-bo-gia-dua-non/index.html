<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Gà Rán Live Mukbang</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#20100d;font-family:system-ui,sans-serif}#game{width:100%;height:100%;touch-action:none}canvas{display:block;margin:auto}</style></head><body><div id="game"></div><script src="node_modules/phaser/dist/phaser.min.js"></script><script>
'use strict';
const SHEET_URL='generated_image.png',FOOD_SHEET_URL='1.png',W=540,H=960,FOOD_TARGET=2000;
const foodData=[{name:'Gà giòn',frame:'f0',gain:145},{name:'Cánh gà',frame:'f1',gain:130},{name:'Khoai tây',frame:'f3',gain:110},{name:'Nước dừa',frame:'f5',gain:7,drink:true}];
class LiveMukbang extends Phaser.Scene{
 constructor(){super('live');this.phase='select';this.foodProgress=0;this.exp=0;this.level=1;this.coins=0;this.viewer=1000000;this.activeDrink=null;this.done=false;this.view=0;this.comments=['Ngon quá bác ơi! 🤤','Món gà giòn nhìn đã quá!','Ai đang xem từ Hà Nội? 👋','Bác ăn ngon miệng nha!','Cho em một phần khoai!','Wow, không thể rời mắt!'];}
 preload(){this.load.spritesheet('sheet',SHEET_URL,{frameWidth:114,frameHeight:114});this.load.image('food',FOOD_SHEET_URL);}
 create(){this.sliceFoodSheet();this.makeBackground();this.makeLiveUI();this.makeCharacters();this.makeTray();this.makeFoodSlots();this.events();}
 sliceFoodSheet(){const texture=this.textures.get('food'),source=texture.getSourceImage(),cols=5,rows=3;for(let row=0;row<rows;row++)for(let col=0;col<cols;col++){const x=Math.round(col*source.width/cols),y=Math.round(row*source.height/rows),right=Math.round((col+1)*source.width/cols),bottom=Math.round((row+1)*source.height/rows);texture.add('f'+(row*cols+col),0,x,y,right-x,bottom-y);}}
 makeBackground(){const g=this.add.graphics();g.fillStyle(0xffd69b).fillRect(0,0,W,H);g.fillStyle(0x82462f).fillRect(0,490,W,470);g.fillStyle(0x5b2f24).fillRect(0,560,W,400);g.fillStyle(0xf3b666).fillRoundedRect(25,154,490,260,24);g.lineStyle(8,0x61392d).strokeRoundedRect(25,154,490,260,24);g.fillStyle(0xfbf1d8).fillRoundedRect(42,171,456,226,16);g.fillStyle(0xff7795).fillRoundedRect(0,0,W,72,0);for(let x=0;x<W;x+=54){g.fillStyle(x%108?0xfff6e3:0xf27691).fillRect(x,0,27,72);g.fillStyle(x%108?0xf27691:0xfff6e3).fillRect(x+27,0,27,72)}this.add.text(W/2,113,'GÀ RÁN • LIVE MUKBANG',{fontFamily:'Arial Black',fontSize:'25px',color:'#69372a',stroke:'#fff5dd',strokeThickness:5}).setOrigin(.5);}
 makeLiveUI(){this.add.rectangle(0,72,W,66,0x482424,.92).setOrigin(0);this.add.text(18,86,'● LIVE',{fontFamily:'Arial Black',fontSize:'18px',color:'#fff'});this.viewerText=this.add.text(118,88,'👁 1.000.000',{fontStyle:'bold',fontSize:'16px',color:'#fff6dd'});this.coinText=this.add.text(432,88,'🪙 0',{fontFamily:'Arial Black',fontSize:'17px',color:'#ffe374'});this.add.text(24,430,'FOOD PROGRESS',{fontFamily:'Arial Black',fontSize:'13px',color:'#fff7df'});this.progressLabel=this.add.text(516,430,'0 / 2000',{fontStyle:'bold',fontSize:'13px',color:'#fff7df'}).setOrigin(1,0);this.foodBar=this.bar(24,451,492,18,0xf8b844);this.add.text(25,478,'LEVEL '+this.level,{fontFamily:'Arial Black',fontSize:'14px',color:'#fff7df'});this.expLabel=this.add.text(516,478,'EXP 0 / 100',{fontStyle:'bold',fontSize:'14px',color:'#fff7df'}).setOrigin(1,0);this.expBar=this.bar(24,499,492,12,0x70d8a5);const view=this.add.text(509,20,'◉ KHUNG NHÌN',{fontSize:'11px',fontStyle:'bold',color:'#6b392a',backgroundColor:'#fff6dd',padding:{x:7,y:6}}).setOrigin(1,0).setInteractive({useHandCursor:true});view.on('pointerup',()=>this.cycleView());}
 bar(x,y,w,h,color){const bg=this.add.rectangle(x,y,w,h,0x593228).setOrigin(0);const fill=this.add.rectangle(x+3,y+3,1,h-6,color).setOrigin(0);fill.max=w-6;return fill;}
 makeCharacters(){this.customer=this.add.sprite(102,304,'sheet',12).setScale(1.48).setInteractive({useHandCursor:true});this.customer.setData('baseY',304);this.customer.on('pointerup',()=>this.customerReact());this.tweens.add({targets:this.customer,y:296,duration:950,yoyo:true,repeat:-1,ease:'Sine.easeInOut'});this.seller=this.add.sprite(382,332,'sheet',2).setScale(1.82).setInteractive({useHandCursor:true});this.seller.setData('baseY',332);this.tweens.add({targets:this.seller,y:324,duration:1200,yoyo:true,repeat:-1,ease:'Sine.easeInOut'});this.add.text(101,384,'KHÁCH',{fontFamily:'Arial Black',fontSize:'13px',color:'#7a4030'}).setOrigin(.5);this.add.text(385,404,'BÁC ĐẦU BẾP',{fontFamily:'Arial Black',fontSize:'13px',color:'#7a4030'}).setOrigin(.5);}
 makeTray(){this.add.ellipse(270,618,470,124,0xf4e2bd).setStrokeStyle(8,0x733e2c);this.trayTitle=this.add.text(270,574,'KHAY PHỤC VỤ',{fontFamily:'Arial Black',fontSize:'15px',color:'#6d3a2a'}).setOrigin(.5);this.slotPos=[[160,640],[270,640],[380,640],[460,640]];this.slotPos.forEach(([x,y],i)=>{this.add.circle(x,y,i===3?44:50,0xfff9e9).setStrokeStyle(4,0xd58b65);});}
 makeFoodSlots(){this.foods=[];this.selected=[];this.pickLabel=this.add.text(270,710,'CHỌN 3 MÓN ĐẶT VÀO KHAY',{fontFamily:'Arial Black',fontSize:'16px',color:'#fff8df',stroke:'#6b392a',strokeThickness:4}).setOrigin(.5);this.pickButtons=[];foodData.forEach((food,index)=>{const x=92+index*118,button=this.add.container(x,793);const plate=this.add.circle(0,0,51,0xfff6df).setStrokeStyle(4,0xdd8b68);const icon=this.add.sprite(0,-4,'food',food.frame).setScale(food.drink?.28:.25);const label=this.add.text(0,45,food.name,{fontSize:'11px',fontStyle:'bold',color:'#6b392a',align:'center',wordWrap:{width:100}}).setOrigin(.5);button.add([plate,icon,label]).setSize(108,108).setInteractive({useHandCursor:true});button.on('pointerup',()=>this.chooseFood(food,button));this.pickButtons.push(button);});}
 chooseFood(food,button){if(this.phase!=='select'||this.selected.length>=3||this.selected.includes(food))return;this.selected.push(food);button.disableInteractive();this.tweens.add({targets:button,alpha:.28,scale:.86,duration:160});this.spawnFood(food,this.selected.length-1,false);this.pickLabel.setText(`ĐÃ CHỌN ${this.selected.length} / 3 MÓN`);if(this.selected.length===3)this.showStartMukbang();}
 showStartMukbang(){this.pickLabel.setText('KHAY ĐÃ SẴN SÀNG!');this.startButton=this.add.text(270,885,'BẮT ĐẦU MUKBANG',{fontFamily:'Arial Black',fontSize:'20px',color:'#fff',backgroundColor:'#dc6268',padding:{x:22,y:12}}).setOrigin(.5).setInteractive({useHandCursor:true});this.tweens.add({targets:this.startButton,scale:1.06,duration:500,yoyo:true,repeat:-1});this.startButton.on('pointerup',()=>this.startMukbang());}
 startMukbang(){if(this.phase!=='select')return;this.phase='mukbang';this.trayTitle.setText('KHAY MUKBANG • CHẠM ĐỂ ĂN');this.pickLabel.destroy();this.pickButtons.forEach(button=>button.destroy());this.startButton.destroy();this.foods.forEach(sprite=>this.enableConsume(sprite));this.spawnComment('LIVE bắt đầu! Bác đầu bếp chuẩn bị ăn! 🎥');this.time.addEvent({delay:1500,loop:true,callback:()=>this.spawnComment()});this.time.delayedCall(4000,()=>this.showGift());}
 spawnFood(data,index,active=true){const [x,y]=this.slotPos[index];const sprite=this.add.sprite(x,y+120,'food',data.frame).setScale(data.drink?0.32:0.30);sprite.setData({food:data,index,consumed:false});if(active)this.enableConsume(sprite);this.foods[index]=sprite;this.tweens.add({targets:sprite,y,duration:280,ease:'Back.easeOut',onComplete:()=>this.tweens.add({targets:sprite,angle:{from:-2,to:2},duration:850+index*90,yoyo:true,repeat:-1,ease:'Sine.easeInOut'})});}
 enableConsume(sprite){sprite.setInteractive({useHandCursor:true});sprite.on('pointerdown',()=>this.startConsume(sprite));sprite.on('pointerup',()=>this.stopConsume(sprite));sprite.on('pointerout',()=>this.stopConsume(sprite));}
 events(){this.input.on('pointerup',()=>this.stopConsume());}
 startConsume(sprite){if(this.phase!=='mukbang'||this.done||sprite.getData('consumed'))return;const f=sprite.getData('food');if(f.drink){this.activeDrink=sprite;this.time.delayedCall(500,()=>{if(this.activeDrink===sprite)this.chug(sprite);});this.drinkSafety=this.time.delayedCall(2500,()=>this.stopConsume(sprite));return}this.eat(sprite,f.gain);}
 chug(sprite){if(this.activeDrink!==sprite||this.done)return;this.eat(sprite,7,true);this.chugLoop=this.time.addEvent({delay:340,loop:true,callback:()=>{if(this.activeDrink===sprite)this.eat(sprite,7,true);}});}
 stopConsume(sprite){if(sprite&&this.activeDrink!==sprite)return;if(this.chugLoop){this.chugLoop.remove();this.chugLoop=null}if(this.drinkSafety){this.drinkSafety.remove();this.drinkSafety=null}if(this.activeDrink){this.tweens.add({targets:this.activeDrink,scaleX:.32,scaleY:.32,duration:120});}this.activeDrink=null;}
 eat(sprite,gain,drink=false){if(this.done)return;this.seller.setFrame(drink?5:2);this.customer.setFrame(13);this.tweens.add({targets:sprite,scaleX:sprite.scaleX*.82,scaleY:sprite.scaleY*.82,duration:110,yoyo:true});this.tweens.add({targets:this.seller,scaleX:1.92,scaleY:1.72,duration:110,yoyo:true,onComplete:()=>this.seller.setFrame(1)});this.pulse(sprite.x,sprite.y,drink?'+7 EXP':`+${gain}`);this.addProgress(gain,drink);if(!drink){sprite.setData('consumed',true);this.tweens.add({targets:sprite,alpha:0,scaleX:.15,scaleY:.15,duration:260,onComplete:()=>this.respawn(sprite.getData('index'))});}}
 respawn(index){if(this.done)return;const f=foodData[Phaser.Math.Between(0,2)];this.spawnFood(f,index);}
 addProgress(gain,drink){this.foodProgress=Math.min(FOOD_TARGET,this.foodProgress+(drink?35:gain));this.exp+=drink?7:12;while(this.exp>=100){this.exp-=100;this.level++;this.levelUp()}this.progressLabel.setText(`${this.foodProgress} / ${FOOD_TARGET}`);this.expLabel.setText(`EXP ${this.exp} / 100`);this.tweens.add({targets:this.foodBar,displayWidth:this.foodBar.max*this.foodProgress/FOOD_TARGET,duration:170});this.tweens.add({targets:this.expBar,displayWidth:this.expBar.max*this.exp/100,duration:170});this.viewer+=Phaser.Math.Between(220,860);this.viewerText.setText('👁 '+this.viewer.toLocaleString('vi-VN'));if(this.foodProgress>=FOOD_TARGET)this.finish();}
 pulse(x,y,text){const t=this.add.text(x,y-45,text,{fontFamily:'Arial Black',fontSize:'20px',color:'#fff8c4',stroke:'#9a4d39',strokeThickness:5}).setOrigin(.5);this.tweens.add({targets:t,y:y-105,alpha:0,duration:700,onComplete:()=>t.destroy()});const c=this.add.circle(x,y,15,0xffe176,.8);this.tweens.add({targets:c,scale:3,alpha:0,duration:350,onComplete:()=>c.destroy()});}
 customerReact(){this.customer.setFrame(18);this.tweens.add({targets:this.customer,scaleX:1.68,scaleY:1.68,duration:180,yoyo:true,onComplete:()=>this.customer.setFrame(12)});this.spawnComment('Khách thả tim cho bác! 💖');}
 spawnComment(forced){if(this.done)return;const msg=forced||Phaser.Utils.Array.GetRandom(this.comments);const y=Phaser.Math.Between(180,430);const box=this.add.container(560,y);const bg=this.add.rectangle(0,0,260,43,0xfff9eb,.96).setStrokeStyle(2,0xef9a86);const tx=this.add.text(-116,-10,msg,{fontSize:'13px',fontStyle:'bold',color:'#63362d',wordWrap:{width:225}});box.add([bg,tx]);this.tweens.add({targets:box,x:-150,duration:4800,ease:'Linear',onComplete:()=>box.destroy()});}
 showGift(){if(this.done)return;const card=this.add.container(270,270).setScale(.1).setAlpha(0);const bg=this.add.rectangle(0,0,292,152,0xffe9b1).setStrokeStyle(5,0xd36563);const icon=this.add.sprite(-95,-5,'sheet',87).setScale(.66);const title=this.add.text(-42,-50,'GIFT TỪ VIEWER!',{fontFamily:'Arial Black',fontSize:'18px',color:'#8a3f3c'});const sub=this.add.text(-42,-23,'🎁 50 coin đang chờ',{fontSize:'15px',color:'#6b392a'});const claim=this.add.text(24,18,'NHẬN',{fontFamily:'Arial Black',fontSize:'18px',color:'#fff',backgroundColor:'#dd646a',padding:{x:18,y:9}}).setInteractive({useHandCursor:true});card.add([bg,icon,title,sub,claim]);this.tweens.add({targets:card,scale:1,alpha:1,duration:330,ease:'Back.easeOut'});let timeout=this.time.delayedCall(5000,()=>card.destroy());claim.on('pointerup',()=>{if(!card.active)return;timeout.remove();this.coins+=50;this.coinText.setText('🪙 '+this.coins);this.pulse(270,330,'+50 COIN');this.tweens.add({targets:card,scale:1.25,alpha:0,duration:220,onComplete:()=>card.destroy()});this.time.delayedCall(4000,()=>this.showGift());});}
 levelUp(){this.add.text(270,210,'LEVEL UP!',{fontFamily:'Arial Black',fontSize:'34px',color:'#fff3a4',stroke:'#a14b40',strokeThickness:7}).setOrigin(.5).setScale(.2).setAlpha(0).setDepth(10);const t=this.children.getLast();this.tweens.add({targets:t,scale:1,alpha:1,duration:240,yoyo:true,hold:520,onComplete:()=>t.destroy()});}
 cycleView(){this.view=(this.view+1)%3;const cam=this.cameras.main;const modes=[{z:1,y:0,n:'◉ KHUNG NHÌN'},{z:1.15,y:40,n:'◉ BÀN ĂN'},{z:1.28,y:95,n:'◉ NHÂN VẬT'}],m=modes[this.view];cam.pan(W/2,H/2+m.y,260,'Sine.easeInOut');cam.zoomTo(m.z,260);this.children.list.find(x=>x.text?.includes('KHUNG')||x.text?.includes('BÀN ĂN')||x.text?.includes('NHÂN VẬT'))?.setText(m.n);}
 finish(){if(this.done)return;this.done=true;this.stopConsume();this.seller.setFrame(8);this.customer.setFrame(17);for(let i=0;i<32;i++){const s=this.add.text(Phaser.Math.Between(30,510),Phaser.Math.Between(80,660),'✦',{fontSize:Phaser.Math.Between(18,38)+'px',color:'#fff09c'});this.tweens.add({targets:s,y:s.y-100,alpha:0,duration:900,delay:i*25,onComplete:()=>s.destroy()});}const panel=this.add.container(270,430).setScale(.1).setAlpha(0).setDepth(20);panel.add([this.add.rectangle(0,0,410,270,0xfff4d6).setStrokeStyle(7,0xa54b42),this.add.text(0,-91,'MUKBANG HOÀN THÀNH!',{fontFamily:'Arial Black',fontSize:'23px',color:'#923e39'}).setOrigin(.5),this.add.text(0,-46,'Viewer yêu thích bữa ăn của bác!',{fontSize:'16px',color:'#63362d'}).setOrigin(.5),this.add.text(0,0,`🪙 +${100+this.coins} COIN`,{fontFamily:'Arial Black',fontSize:'28px',color:'#d58a26'}).setOrigin(.5)]);const again=this.add.text(0,65,'CHƠI LẠI',{fontFamily:'Arial Black',fontSize:'19px',color:'#fff',backgroundColor:'#d96565',padding:{x:25,y:12}}).setOrigin(.5).setInteractive({useHandCursor:true});again.on('pointerup',()=>this.scene.restart());panel.add(again);this.tweens.add({targets:panel,scale:1,alpha:1,duration:420,ease:'Back.easeOut'});}
}
new Phaser.Game({type:Phaser.CANVAS,parent:'game',width:W,height:H,backgroundColor:'#20100d',scene:LiveMukbang,render:{antialias:true,roundPixels:true},fps:{target:60,min:30,forceSetTimeOut:false},scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH}});
</script></body></html>
