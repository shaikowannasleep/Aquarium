<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Gà Rán & Bơ Già Dừa Non</title>
<style>
:root{--cream:#fff4e3;--paper:#fffaf0;--ink:#432b24;--muted:#886759;--line:#e5c9aa;--pink:#ea7890;--green:#579a70;--wood:#9b6542}*{box-sizing:border-box}body{margin:0;background:#f2dfc5;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:manipulation}.app{width:min(100%,600px);min-height:100dvh;margin:auto;background:var(--cream);overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 10px;background:#fff9ec;font-weight:900}.top small{display:block;color:var(--muted);font-size:.72rem;font-weight:700}.score{color:#aa5364}.awning{height:26px;background:repeating-linear-gradient(90deg,#ef8195 0 28px,#fffaf0 28px 56px);border-bottom:7px solid #d77087}.scene{padding:14px;background:linear-gradient(#f7c98f 0 49%,#a96c49 50% 100%);min-height:calc(100dvh - 76px)}.sign{background:#394d3b;color:#fff5df;border:6px solid var(--wood);border-radius:12px;padding:7px 12px;text-align:center;font-size:.9rem;font-weight:900;box-shadow:0 4px #6b402d}.customer-zone{height:132px;display:flex;align-items:end;justify-content:center;position:relative}.customer{width:116px;height:116px;background-image:url('assets/khach.svg');background-size:500% 300%;border:4px solid #fff4e3;border-radius:50%;box-shadow:0 4px 0 #69442b55;background-color:#fff8ed;animation:arrive .42s ease-out}.customer.happy{filter:saturate(1.22);transform:translateY(-5px)}.customer.sad{filter:grayscale(.35);transform:translateY(4px)}.bubble{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:min(310px,88vw);background:#fffdf6;border:3px solid #704b3f;border-radius:17px;padding:10px 14px;text-align:center;font-weight:800;box-shadow:0 4px #704b3f33}.bubble:after{content:"";position:absolute;bottom:-11px;left:50%;margin-left:-10px;border:10px solid transparent;border-top-color:#704b3f;border-bottom:0}.bubble small{display:block;color:var(--muted);font-size:.72rem;margin-top:2px}.order{background:#fff9ec;border:3px dashed #bd7d5a;border-radius:16px;padding:10px;margin-bottom:12px;display:flex;gap:10px;align-items:center}.order-copy{flex:1}.order-copy b{display:block;font-size:.83rem;color:#a5475d}.order-copy span{font-size:1.03rem;font-weight:900}.food{width:58px;height:58px;background-image:url('assets/menu.svg');background-size:500% 300%;flex:none;border-radius:12px}.counter{background:#fff8ed;border:4px solid #754934;border-radius:19px;padding:12px;box-shadow:0 7px #754934}.counter h2{font-size:1rem;margin:0 0 8px;text-align:center}.tray{min-height:88px;border:3px dashed #c89b6c;border-radius:14px;background:#f7e5c9;display:flex;align-items:center;justify-content:center;gap:7px;padding:8px;transition:.2s}.tray.ready{border-color:var(--green);background:#e7f3df;animation:pop .28s ease}.empty{font-size:.78rem;font-weight:700;color:var(--muted);text-align:center}.tray-item{position:relative}.tray-item button{position:absolute;right:-5px;top:-6px;border:0;background:#b94f62;color:white;border-radius:50%;width:21px;height:21px;font-weight:900;line-height:18px}.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.dish{border:3px solid #e4c29e;background:#fffdf7;border-radius:14px;padding:5px 2px 7px;min-height:88px;font-size:.72rem;color:var(--ink);font-weight:900;transition:transform .14s,border-color .14s;box-shadow:0 2px #d0aa83}.dish:active{transform:scale(.94)}.dish.selected{border-color:var(--green);background:#e8f3e0}.dish .food{width:52px;height:52px;margin:auto}.actions{display:flex;gap:8px;margin-top:11px}.actions button{flex:1;border:0;border-radius:13px;padding:12px 9px;color:white;font-size:.9rem;font-weight:900;box-shadow:0 4px #7b3a4b}.confirm{background:var(--pink)}.confirm:disabled{opacity:.45;box-shadow:none}.clear{background:#9f765d;box-shadow:0 4px #6c4937!important}.hint{text-align:center;font-size:.76rem;color:#fff8e9;margin:13px 6px 0;font-weight:700}.feedback{margin:0 0 11px;padding:10px 12px;border-radius:13px;text-align:center;font-weight:900;animation:pop .25s ease}.feedback.good{background:#dff1d8;color:#36744d}.feedback.bad{background:#ffe0da;color:#a54343}.next{display:block;margin:10px auto 0;border:0;border-radius:13px;padding:12px 22px;background:var(--green);color:white;font-weight:900;box-shadow:0 4px #357154}@keyframes arrive{from{opacity:0;transform:translateX(55px)}to{opacity:1;transform:none}}@keyframes pop{50%{transform:scale(1.035)}}@media(max-width:380px){.scene{padding:10px}.customer-zone{height:124px}.shelf{gap:5px}.dish{font-size:.65rem}.order{margin-bottom:8px}}
</style></head><body><div class="app"><header class="top"><div>ĐƠN <span id="orderNo">1</span><small id="stateLabel">Khách đang gọi món</small></div><div style="text-align:center">GÀ RÁN<br><small>& BƠ GIÀ DỪA NON</small></div><div class="score">★ <span id="score">0</span><small id="progress">0 / 3 đơn</small></div></header><div class="awning"></div><main class="scene" id="game"></main></div>
<script>
'use strict';const foods=[{id:'dui',name:'Đùi gà giòn',sprite:0},{id:'canh',name:'Cánh gà',sprite:1},{id:'cay',name:'Gà cay',sprite:3},{id:'khoai',name:'Khoai tây',sprite:6},{id:'bo',name:'Sinh tố bơ',sprite:12},{id:'dua',name:'Nước dừa non',sprite:13}],orders=[{customer:'Cô Mai',face:2,need:['dui','dua'],say:'Cho cô một đùi gà giòn và nước dừa non nhé!'},{customer:'Chú Hòa',face:5,need:['cay','khoai'],say:'Chú gọi gà cay với khoai tây.'},{customer:'Bạn An',face:0,need:['bo','canh'],say:'Cho mình sinh tố bơ và một cánh gà nha!'}];let game={phase:'WaitingForOrder',index:0,selected:[],score:0,feedback:null};const $=s=>document.querySelector(s),item=id=>foods.find(x=>x.id===id),pos=n=>`background-position:${n%5*25}% ${Math.floor(n/5)*50}%`,food=(id,klass='food')=>`<span class="${klass}" style="${pos(item(id).sprite)}" aria-label="${item(id).name}"></span>`;function sameOrder(){const a=[...orders[game.index].need].sort(),b=[...game.selected].sort();return a.length===b.length&&a.every((v,i)=>v===b[i])}function setPhase(p){game.phase=p;$('#stateLabel').textContent=({WaitingForOrder:'Khách đang gọi món',SelectingItems:'Chọn món trên quầy',ReadyToServe:'Khay đã sẵn sàng',CheckingOrder:'Đang kiểm tra đơn',Feedback:'Phản hồi khách hàng',NextOrder:'Chuẩn bị đơn kế tiếp'})[p]}
function render(){if(game.index>=orders.length){$('#game').innerHTML=`<div class="sign">✦ HẾT CA LÀM VIỆC ✦</div><div class="customer-zone"><div class="customer happy" style="${pos(0)}"></div></div><div class="feedback good">Hoàn thành ${orders.length} đơn! Bạn nhận được ${game.score} sao.</div><button class="next" id="restart">Chơi lại từ đầu</button>`;$('#orderNo').textContent='✓';$('#progress').textContent=`${orders.length} / ${orders.length} đơn`;return}const o=orders[game.index],ready=game.selected.length===o.need.length;setPhase(game.feedback?'Feedback':ready?'ReadyToServe':game.selected.length?'SelectingItems':'WaitingForOrder');$('#orderNo').textContent=game.index+1;$('#score').textContent=game.score;$('#progress').textContent=`${game.index} / ${orders.length} đơn`;$('#game').innerHTML=`<div class="sign">✦ QUẦY GÀ & BƠ DỪA ✦</div><section class="customer-zone"><div class="bubble">${game.feedback?game.feedback.text:o.say}<small>${game.feedback?'Nhấn “Đơn tiếp theo” để tiếp tục':'Yêu cầu của '+o.customer}</small></div><div class="customer ${game.feedback?(game.feedback.ok?'happy':'sad'):''}" style="${pos(o.face)}"></div></section><section class="order"><div class="order-copy"><b>PHIẾU YÊU CẦU</b><span>${o.need.map(id=>item(id).name).join(' + ')}</span></div>${o.need.map(id=>food(id)).join('')}</section>${game.feedback?`<div class="feedback ${game.feedback.ok?'good':'bad'}">${game.feedback.ok?'✓ ĐÚNG ĐƠN · +1 SAO':'✕ CHƯA ĐÚNG · Hãy kiểm tra lại món trên khay'}</div>`:''}<section class="counter"><h2>KHAY PHỤC VỤ</h2><div class="tray ${ready?'ready':''}">${game.selected.length?game.selected.map(id=>`<div class="tray-item">${food(id)}${!game.feedback?`<button data-remove="${id}" aria-label="Bỏ ${item(id).name}">×</button>`:''}</div>`).join(''):'<span class="empty">Chạm món dưới quầy để đặt vào khay</span>'}</div>${game.feedback?`<button class="next" id="next">${game.feedback.ok?'Đơn tiếp theo':'Đổi món trên khay'}</button>`:`<div class="actions"><button class="clear" id="clear" ${game.selected.length?'':'disabled'}>Dọn khay</button><button class="confirm" id="confirm" ${ready?'':'disabled'}>Xác nhận đơn</button></div>`}</section><section class="shelf">${foods.map(f=>`<button class="dish ${game.selected.includes(f.id)?'selected':''}" data-food="${f.id}" ${game.feedback?'disabled':''}>${food(f.id)}<span>${f.name}</span></button>`).join('')}</section><p class="hint">Chọn đúng món và đúng số lượng. Chạm × để bỏ món khỏi khay.</p>`}
$('#game').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='restart'){game={phase:'WaitingForOrder',index:0,selected:[],score:0,feedback:null};render();return}if(b.id==='clear'){game.selected=[];render();return}if(b.dataset.remove){game.selected.splice(game.selected.indexOf(b.dataset.remove),1);render();return}if(b.dataset.food){if(game.selected.length<orders[game.index].need.length)game.selected.push(b.dataset.food);render();return}if(b.id==='confirm'){game.phase='CheckingOrder';const ok=sameOrder();game.feedback={ok,text:ok?'Cảm ơn quán, đúng món rồi!':'Ôi, hình như món này chưa đúng rồi…'};if(ok)game.score++;render();return}if(b.id==='next'){if(game.feedback.ok){game.index++;game.selected=[];game.feedback=null}else game.feedback=null;render()}});render();
</script></body></html>
