<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff4e3"><title>Tiệm Gà Rán & Bơ Già Dừa Non</title>
<style>
:root{--cream:#fff4e3;--paper:#fffbf2;--ink:#432b24;--muted:#886759;--line:#ecd7ba;--pink:#ea7890;--rose:#bf4f69;--green:#63a680;--wood:#9b6542;--chalk:#304b3a}*{box-sizing:border-box}body{margin:0;background:#f7e7cf;color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;touch-action:manipulation}button,input{font:inherit}button{cursor:pointer;color:inherit}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:560px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--cream);box-shadow:0 0 45px #82553623}.top{position:sticky;top:0;z-index:4;background:var(--cream);display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:4px;align-items:center;padding:12px 14px 9px;font-weight:800}.top small{display:block;font-size:.71rem;color:var(--muted);font-weight:600}.top .center{text-align:center;font-size:1.2rem}.top .right{text-align:right}.stars{color:#eab141;letter-spacing:-1px}.awning{height:23px;background:repeating-linear-gradient(90deg,#f1849a 0 26px,#fffaf0 26px 52px);position:relative;flex:none}.awning:after{content:'';position:absolute;bottom:-8px;width:100%;height:9px;background:radial-gradient(circle at 13px 0,#f1849a 8px,transparent 9px) 0 0/52px 9px,radial-gradient(circle at 39px 0,#fffaf0 8px,transparent 9px) 0 0/52px 9px}.banner{text-align:center;margin:19px 14px 10px;padding:10px;border-radius:16px;background:#fff8ec;border:2px solid #b9855d;font-weight:900;font-size:1.2rem}.board{background:var(--chalk);border:7px solid var(--wood);border-radius:11px;color:#fdf2db;margin:0 12px 12px;padding:12px;box-shadow:0 4px 0 #492a1d40}.board h2{margin:0 0 8px;text-align:center;font-size:1.15rem}.board .items{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:.79rem}.board .items div{display:flex;justify-content:space-between;gap:3px;border-bottom:1px dashed #ffffff55}.tabs,.subtabs{display:flex;overflow:auto;gap:4px;padding:4px;margin:0 12px;background:#efdcc9;border-radius:15px 15px 0 0}.tabs button,.subtabs button{border:0;background:none;min-width:max-content;flex:1;padding:9px 6px;border-radius:10px;font-size:.75rem;font-weight:800}.tabs .active,.subtabs .active{background:var(--paper);color:var(--rose)}.panel{margin:0 12px 100px;background:var(--paper);padding:14px;border-radius:0 0 16px 16px;min-height:180px}.subtabs{margin:0 0 12px;border-radius:10px}.info{color:var(--muted);font-size:.83rem;line-height:1.4}.row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}.row .details{flex:1;min-width:0}.row b{display:block;font-size:.87rem}.row small{display:block;color:var(--muted);font-size:.7rem}.controls{display:flex;align-items:center;gap:2px}.controls button{background:var(--cream);border:2px solid var(--line);border-radius:9px;width:30px;height:34px;font-weight:900}.controls input{width:43px;text-align:center;border:2px solid var(--line);border-radius:8px;height:34px;background:white}.foot{position:fixed;bottom:0;left:0;right:0;z-index:5;background:linear-gradient(transparent,var(--cream) 30%);padding:16px max(12px,calc((100vw - 540px)/2)) calc(13px + env(safe-area-inset-bottom))}.big{width:100%;border:0;background:var(--pink);color:white;padding:13px 14px;font-size:1rem;font-weight:900;border-radius:15px;box-shadow:0 4px var(--rose)}.big.alt{background:var(--green);box-shadow:0 4px #357859}.big.warn{background:#d87859;box-shadow:0 4px #ac4b3a}.box{padding:10px;border:2px solid var(--line);border-radius:12px;background:#fff6e9;margin:8px 0}.pill{padding:5px 9px;border-radius:9px;background:#f4e5d5;font-size:.75rem;font-weight:800}.icon{width:43px;height:43px;flex:none;display:inline-block;background-size:500% 300%;background-repeat:no-repeat;border-radius:9px;box-shadow:0 1px 3px #75533228}.icon.large{width:67px;height:67px}.icon.tiny{width:30px;height:30px}.money{color:#3a8d62;font-weight:900}.warntext{color:#be594c}.rev{border-bottom:1px solid var(--line);padding:9px 0;font-size:.82rem}.link{border:2px solid var(--line);background:#fff8ed;border-radius:9px;padding:8px;font-size:.82rem;font-weight:800}.gap{height:8px}.sell{padding:16px 12px 110px;flex:1;background:linear-gradient(#fff3dd 0 35%,#e9c7a6 36% 39%,#c59370 40% 100%)}.orderlist{display:flex;overflow:auto;gap:9px;padding:2px 2px 12px;min-height:137px;align-items:stretch}.customer{flex:0 0 190px;background:#fffaf0;border:2px solid var(--line);border-radius:15px;padding:8px;text-align:left}.customer.active{border-color:var(--pink);box-shadow:0 0 0 2px #ec748d50}.customer .who{display:flex;align-items:center;gap:7px;font-weight:800;font-size:.85rem}.customer .want{font-size:.8rem;margin:5px 0}.bar{height:8px;background:#ead6b6;border-radius:6px;overflow:hidden}.bar i{height:100%;display:block;background:var(--green);transition:width .15s}.station{background:#fff7ea;border:3px solid #a46f50;border-radius:17px;margin:12px 0;padding:12px;box-shadow:0 7px #7b4a37}.station h3{margin:0 0 7px;font-size:1rem}.target{font-weight:800;color:#a33d55;font-size:.86rem}.ready{background:#e9f6dc;color:#3c805c;border-radius:9px;padding:6px 9px;font-weight:800;font-size:.8rem}.foodarea{display:flex;gap:8px;align-items:center;justify-content:center;margin:14px 0;min-height:94px}.progress{background:#d8c2a2;height:18px;overflow:hidden;border:2px solid #88684e;border-radius:12px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f4b647 70%,#d67b4e 100%)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:9px 0}.tile{border:2px solid var(--line);background:#fffaf1;border-radius:12px;padding:6px 3px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:800;font-size:.69rem;min-height:76px}.tile.chosen{border-color:var(--green);background:#eaf6e9}.tile .icon{width:40px;height:40px}.actions{display:flex;gap:8px}.actions button{flex:1}.overlay{position:fixed;inset:0;background:#402720bb;z-index:10;display:grid;place-items:center;padding:20px}.dialog{max-width:450px;width:100%;background:var(--paper);border:3px solid #a97959;padding:20px;border-radius:21px;text-align:center;max-height:90dvh;overflow:auto}.dialog h1{font-size:1.6rem}.dialog p{line-height:1.45}.dialog .big{margin:7px 0}.hidden{display:none!important}.tip{position:fixed;z-index:12;top:70px;left:50%;transform:translateX(-50%);background:#463025;color:white;border-radius:13px;padding:8px 14px;text-align:center;max-width:90vw;font-size:.85rem;pointer-events:none;box-shadow:0 4px 15px #0005}@media(max-width:370px){.board .items{font-size:.7rem}.controls input{width:35px}.tabs button{font-size:.7rem}.customer{flex-basis:165px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div class="app"><header class="top"><div>Ngày <span id="day">1</span><small id="phase">Chuẩn bị</small></div><div class="center"><small>Gà Rán • Bơ Già Dừa Non</small><span id="cash">400k</span></div><div class="right"><span class="stars" id="stars">★★★★☆</span><small id="rating">4,0</small></div></header><div class="awning"></div><main id="view"></main></div><div id="overlay" class="overlay hidden"><div id="dialog" class="dialog"></div></div><div id="tip" class="tip hidden" role="status"></div>
<script>
'use strict';
/* Atlas 5 tấm × 15 ô, mỗi ô 200 × 200 trong SVG 1000 × 600. */
const atlas={menu:'assets/menu.svg',stock:'assets/nguyen-lieu.svg',people:'assets/khach.svg',gear:'assets/trang-bi.svg',status:'assets/phan-hoi.svg'};
function icon(sheet,index,cls=''){const x=index%5,y=Math.floor(index/5);return `<span class="icon ${cls}" role="img" aria-label="${sheet} ${index+1}" style="background-image:url('${atlas[sheet]}');background-position:${x*25}% ${y*50}%"></span>`}
const $=s=>document.querySelector(s), money=n=>Math.round(n/1000).toLocaleString('vi-VN')+'k';
const ITEMS={
 dui:{n:'Đùi gà giòn',p:32000,c:11000,im:0,cat:'Gà rán',need:{ga:1,bot:1,dau:1,hop:1},t:2.5},
 canh:{n:'Cánh gà',p:27000,c:9500,im:1,cat:'Gà rán',need:{ga:1,bot:1,dau:1,hop:1},t:2.1},
 cay:{n:'Gà cay',p:35000,c:13000,im:3,cat:'Gà rán',need:{ga:1,bot:1,dau:1,ot:1,hop:1},t:2.7},
 khoai:{n:'Khoai tây chiên',p:18000,c:5500,im:6,cat:'Gà rán',need:{khoai:1,dau:1,hop:1},t:1.7},
 bo:{n:'Sinh tố bơ già',p:29000,c:10500,im:12,cat:'Bơ & dừa',need:{bo:1,sua:1,da:1,ly:1},t:2.0},
 dua:{n:'Nước dừa non',p:24000,c:8500,im:13,cat:'Bơ & dừa',need:{dua:1,da:1,ly:1},t:1.5},
 bodua:{n:'Bơ già dừa non',p:39000,c:16500,im:9,cat:'Bơ & dừa',need:{bo:1,dua:1,sua:1,da:1,ly:1},t:2.5},
 kem:{n:'Kem bơ',p:34000,c:14000,im:11,cat:'Bơ & dừa',need:{bo:1,sua:1,da:1,ly:1},t:2.2}
};
const ING={ga:{n:'Gà tươi',c:6500,life:3,im:0},bot:{n:'Bột chiên giòn',c:1500,life:5,im:1},dau:{n:'Dầu ăn',c:1000,life:5,im:2},ot:{n:'Ớt bột',c:900,life:5,im:4},khoai:{n:'Khoai tây',c:3300,life:3,im:5},hop:{n:'Hộp giấy',c:1200,life:0,im:6},bo:{n:'Bơ già',c:6800,life:2,im:8},dua:{n:'Dừa non',c:6000,life:2,im:9},sua:{n:'Sữa đặc',c:1700,life:5,im:10},da:{n:'Đá viên',c:600,life:1,im:11},ly:{n:'Ly nhựa',c:1200,life:0,im:12}};
const KEYS=Object.keys(ING), MENU=Object.keys(ITEMS), START=400000, STORAGE='fried_avocado_demo_v1';
function fresh(){return {day:1,cash:START,stock:Object.fromEntries(KEYS.map(k=>[k,[]])),prices:Object.fromEntries(MENU.map(k=>[k,ITEMS[k].p])),unlocked:['dui','canh','khoai','bo','dua'],upgrades:[],reviews:[],history:[],name:'Tiệm Gà Rán & Bơ Già Dừa Non'}}
let S;try{S=JSON.parse(localStorage.getItem(STORAGE))}catch{}if(!S||!S.stock||!S.prices||!S.unlocked||!S.upgrades)S=fresh();
let R={mode:'prep',tab:'Kho',sub:'Gà rán',plan:{},orders:[],focus:null,cup:null,seconds:150,served:0,lost:0,sales:0,spent:0,waste:0,paused:false,interval:null,frying:false,toastTimer:null,last:0,seq:0,spawn:0};
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(S))}catch{tip('Trình duyệt không lưu được tiến trình. Hãy dùng chế độ thường.') }}
function qty(k){return (S.stock[k]||[]).reduce((n,b)=>n+b.q,0)}
function addStock(k,n){if(n<=0)return;const exp=ING[k].life?S.day+ING[k].life-1:999999;let batch=S.stock[k].find(b=>b.exp===exp);if(batch)batch.q+=n;else S.stock[k].push({q:n,exp});S.stock[k].sort((a,b)=>a.exp-b.exp)}
function take(k,n=1){if(qty(k)<n)return false;for(const b of S.stock[k]){const q=Math.min(n,b.q);n-=q;b.q-=q;if(n<=0)break}S.stock[k]=S.stock[k].filter(b=>b.q>0);return true}
function have(item){return Object.entries(ITEMS[item].need).every(([k,n])=>qty(k)>=n)}
function missing(item){return Object.entries(ITEMS[item].need).filter(([k,n])=>qty(k)<n).map(([k])=>ING[k].n)}
function rating(){const a=S.reviews.slice(0,40);return a.length?a.reduce((v,r)=>v+r.stars,0)/a.length:4}
function header(){ $('#day').textContent=S.day;$('#phase').textContent=R.mode==='sell'?`Đang bán • ${timeText()}`:'Chuẩn bị';$('#cash').textContent=money(S.cash);const n=rating();$('#stars').textContent='★'.repeat(Math.round(n))+'☆'.repeat(5-Math.round(n));$('#rating').textContent=n.toFixed(1).replace('.',',')+' · '+S.reviews.length+' đánh giá'}
function timeText(){let m=Math.min(22*60,11*60+Math.floor((1-Math.max(0,R.seconds)/150)*660/5)*5);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function tip(t){const e=$('#tip');e.textContent=t;e.classList.remove('hidden');clearTimeout(R.toastTimer);R.toastTimer=setTimeout(()=>e.classList.add('hidden'),3200)}
function modal(html){$('#dialog').innerHTML=html;$('#overlay').classList.remove('hidden')}
function hideModal(){$('#overlay').classList.add('hidden');if(R.mode==='sell'&&R.paused){R.paused=false;R.last=performance.now()}}
function board(){return `<div class="banner">🍗 ${S.name} 🥑</div><div class="board"><h2>✦ MENU HÔM NAY ✦</h2><div class="items">${MENU.filter(k=>S.unlocked.includes(k)).map(k=>`<div><span>${ITEMS[k].n}</span><b>${money(S.prices[k])}</b></div>`).join('')}</div></div>`}
function renderPrep(){R.mode='prep';clearInterval(R.interval);R.interval=null;header();const tabs=['Kho','Nâng cấp','Giá bán','Đánh giá','Tổng kết'];$('#view').innerHTML=board()+`<nav class="tabs">${tabs.map(t=>`<button class="${R.tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('')}</nav><section class="panel" id="panel"></section><div class="foot" id="foot"></div>`;renderTab()}
function renderTab(){const p=$('#panel');if(!p)return;
 if(R.tab==='Kho'){const categories=[['Gà rán',['ga','bot','dau','ot','khoai','hop']],['Bơ & dừa',['bo','dua','sua','da','ly']]];p.innerHTML=`<p class="info">Nhập nguyên liệu trước khi mở cửa. Bấm +/− theo bước 5 hoặc gõ trực tiếp số phần. Hàng tươi có hạn sử dụng.</p><div class="subtabs">${categories.map(([n])=>`<button data-sub="${n}" class="${R.sub===n?'active':''}">${n}</button>`).join('')}</div>${(categories.find(x=>x[0]===R.sub)||categories[0])[1].map(k=>`<div class="row">${icon('stock',ING[k].im)}<div class="details"><b>${ING[k].n}</b><small>Còn ${qty(k)} · ${money(ING[k].c)}/phần · ${ING[k].life?`hạn ${ING[k].life} ngày`:'không hết hạn'}</small></div><div class="controls"><button data-d="${k}" data-v="-5" aria-label="Giảm 5 ${ING[k].n}">−</button><input data-plan="${k}" aria-label="Nhập ${ING[k].n}" type="number" inputmode="numeric" min="0" value="${R.plan[k]||0}"><button data-d="${k}" data-v="5" aria-label="Thêm 5 ${ING[k].n}">+</button></div></div>`).join('')}<p class="info">Gà rán cần: gà/bột/dầu/hộp; nước cần: bơ hoặc dừa/đá/ly. Hãy mua đủ cho ít nhất 1 món.</p>`;
 }else if(R.tab==='Nâng cấp'){p.innerHTML=`<h3>Mở món mới</h3>${MENU.filter(k=>!S.unlocked.includes(k)).map(k=>`<div class="row">${icon('menu',ITEMS[k].im)}<div class="details"><b>${ITEMS[k].n}</b><small>Mở khóa để thêm vào menu</small></div><button class="link" data-unlock="${k}" ${S.cash<90000?'disabled':''}>Mua 90k</button></div>`).join('')||'<p>Đã mở hết món!</p>'}<h3>Trang bị</h3>${[{k:'fryer',n:'Nồi chiên nhanh',im:1,c:130000,d:'Chiên nhanh hơn 35%'},{k:'sign',n:'Biển hiệu',im:6,c:150000,d:'Khách ghé thường xuyên hơn'},{k:'seats',n:'Bàn ghế',im:7,c:170000,d:'Khách chờ lâu hơn 25%'}].map(u=>`<div class="row">${icon('gear',u.im)}<div class="details"><b>${u.n}</b><small>${u.d}</small></div><button class="link" data-up="${u.k}" ${S.upgrades.includes(u.k)||S.cash<u.c?'disabled':''}>${S.upgrades.includes(u.k)?'Đã mua':money(u.c)}</button></div>`).join('')}`
 }else if(R.tab==='Giá bán'){p.innerHTML=`<p class="info">Giá tính bằng nghìn đồng; giá quá cao có thể làm khách bỏ đi hoặc chấm sao thấp.</p>${MENU.filter(k=>S.unlocked.includes(k)).map(k=>`<div class="row">${icon('menu',ITEMS[k].im,'tiny')}<div class="details"><b>${ITEMS[k].n}</b><small>Giá gợi ý ${money(ITEMS[k].p)}</small></div><div class="controls"><input data-price="${k}" type="number" min="5" max="100" step="1" inputmode="numeric" value="${S.prices[k]/1000}" aria-label="Giá ${ITEMS[k].n} nghìn đồng"><span>k</span></div></div>`).join('')}`
 }else if(R.tab==='Đánh giá'){p.innerHTML=`<h3>★ ${rating().toFixed(1).replace('.',',')} / 5 · ${S.reviews.length} đánh giá</h3>${S.reviews.length?S.reviews.slice(0,40).map(r=>`<div class="rev"><b>${icon('people',r.face,'tiny')} ${r.name}</b> <span class="stars">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</span><div>${r.text}</div><small>Ngày ${r.day}</small></div>`).join(''):'<p class="info">Chưa có đánh giá. Bán thử một ly nhé!</p>'}`
 }else{p.innerHTML=`<h3>Sổ tổng kết</h3>${S.history.length?S.history.slice().reverse().map(h=>`<div class="box"><b>Ngày ${h.day}: ${h.served} món · ${h.lost} khách rời đi</b><div>Doanh thu: <span class="money">+${money(h.sales)}</span></div><div>Nhập hàng: −${money(h.spent)} · Chi phí cố định: −${money(h.fixed)}</div><div>Hàng hết hạn: ${h.waste} phần · Lãi: <b class="${h.profit<0?'warntext':'money'}">${money(h.profit)}</b></div></div>`).join(''):'<p class="info">Chưa có dữ liệu. Hãy hoàn thành một ngày bán.</p>'}`}
 renderFoot()}
function costPlan(){return KEYS.reduce((a,k)=>a+(R.plan[k]||0)*ING[k].c,0)}
function renderFoot(){let f=$('#foot');if(!f)return;const cost=costPlan();const playable=MENU.filter(k=>S.unlocked.includes(k)&&have(k));f.innerHTML=cost?`<button class="big" id="buy" ${cost>S.cash?'disabled':''}>${cost>S.cash?'Không đủ tiền':'Nhập hàng'} · ${money(cost)}</button>`:`<button class="big ${playable.length?'alt':'warn'}" id="open">${playable.length?'Mở cửa ngày '+S.day:'Chưa đủ nguyên liệu để mở cửa'}</button>`;if($('#buy'))$('#buy').onclick=e=>{e.stopPropagation();buy()};if($('#open'))$('#open').onclick=e=>{e.stopPropagation();openShop()}}
$('.app').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.tab){R.tab=d.tab;renderPrep()}else if(d.sub){R.sub=d.sub;renderTab()}else if(d.d){if(performance.now()<(R.ignoreStepsUntil||0))return;R.plan[d.d]=Math.max(0,(R.plan[d.d]||0)+Number(d.v));renderTab()}else if(d.unlock){S.cash-=90000;S.unlocked.push(d.unlock);save();renderPrep();tip('Đã mở '+ITEMS[d.unlock].n)}else if(d.up){const u={fryer:130000,sign:150000,seats:170000};S.cash-=u[d.up];S.upgrades.push(d.up);save();renderPrep()}});
$('#view').addEventListener('change',e=>{let i=e.target;if(i.dataset.plan){if(performance.now()<(R.ignoreStepsUntil||0))return;R.plan[i.dataset.plan]=Math.min(999,Math.max(0,Math.floor(Number(i.value)||0)));i.value=R.plan[i.dataset.plan];renderFoot()}else if(i.dataset.price){S.prices[i.dataset.price]=Math.min(100000,Math.max(5000,Math.round((Number(i.value)||5)*1000)));save();renderPrep()}});
function buy(){if(document.activeElement?.matches?.('[data-plan]'))document.activeElement.blur();let cost=costPlan();if(!cost||cost>S.cash)return;S.cash-=cost;R.spent+=cost;KEYS.forEach(k=>addStock(k,R.plan[k]||0));R.plan={};R.ignoreStepsUntil=performance.now()+650;save();renderPrep();tip('Đã nhập hàng. Sẵn sàng mở cửa!')}
function openShop(){let choices=MENU.filter(k=>S.unlocked.includes(k)&&have(k));if(!choices.length){tip('Thiếu nguyên liệu. Hãy mua đủ để làm ít nhất một món.');return}R.mode='sell';Object.assign(R,{seconds:150,orders:[],focus:null,cup:{item:null,step:0,quality:0,ingUsed:false},served:0,lost:0,sales:0,paused:false,frying:false,spawn:0,seq:0,last:performance.now()});renderSell();R.interval=setInterval(loop,100)}
const isFood=k=>ITEMS[k].cat==='Gà rán';
function newOrder(){const choices=MENU.filter(k=>S.unlocked.includes(k));if(!choices.length)return;const available=choices.filter(have);if(!available.length)return;const affordable=available.filter(k=>S.prices[k]<=ITEMS[k].p*1.5||Math.random()<.35);if(!affordable.length)return;const k=affordable[Math.floor(Math.random()*affordable.length)],face=Math.floor(Math.random()*15),id=++R.seq;const patience=S.upgrades.includes('seats')?76:60;R.orders.push({id,k,face,name:['Bạn An','Bạn Bảo','Chị Chi','Anh Duy','Bé Em','Chú Hòa','Bà Mai','Bạn Nhi','Bạn Quân','Chị Thư','Anh Tín','Bạn Uyên','Anh Vũ','Bạn Xoài','Chị Yến'][face],time:patience,max:patience});if(!R.focus)R.focus=id;renderSell()}
function target(){return R.orders.find(o=>o.id===R.focus)||R.orders[0]||null}
function contentSell(){let o=target(),c=R.cup;const say=o?`Làm cho mình một phần <b>${ITEMS[o.k].n}</b> nhé!`:'Đang chờ khách tới quán…';let main;
 if(c.item){let i=ITEMS[c.item];let activity=isFood(c.item)?`Nhấn giữ nút chiên đến khi thanh đạt <b>vùng xanh (70–90%)</b> rồi thả.`:`Chạm <b>Xay / Rót</b>, sau đó <b>Thêm đá / Đóng nắp</b>.`;main=`<div class="target">Đang làm: ${i.n}${o&&o.k!==c.item?' · khác món khách đang xem':''}</div><div class="foodarea">${icon('menu',i.im,'large')}<span style="font-size:2rem">${isFood(c.item)?'🍳':'🥤'}</span>${icon('menu',i.im,'large')}</div><div class="progress"><i id="prog"></i></div><p class="info">${activity}</p><div class="actions">${isFood(c.item)?`<button class="big alt" id="fry">${c.step>=2?'Đã chiên':'Giữ để chiên'}</button>`:`<button class="big alt" data-mix="1">${c.step>=1?'Đã xay / rót':'Xay / Rót'}</button><button class="big alt" data-mix="2">${c.step>=2?'Đã thêm đá':'Thêm đá / Đóng nắp'}</button>`}</div><div class="gap"></div><div class="actions"><button class="big" id="serve">Giao món</button><button class="link" id="trash">Đổ bỏ</button></div>`;
 }else{main=`<p class="info">Chạm món để bắt đầu chế biến. Nguyên liệu sẽ trừ trong kho khi bắt đầu; đổ bỏ vẫn mất nguyên liệu.</p><div class="grid">${MENU.filter(k=>S.unlocked.includes(k)).map(k=>`<button class="tile" data-start="${k}" ${have(k)?'':'disabled'}>${icon('menu',ITEMS[k].im)}<span>${ITEMS[k].n}</span><small>Còn ${Math.min(...Object.entries(ITEMS[k].need).map(([x,n])=>Math.floor(qty(x)/n)))} suất</small></button>`).join('')}</div>`}
 return `<div class="sell"><div class="box"><b>⏱ Giờ bán: <span id="clock">${timeText()}</span></b> · đã bán <span id="count">${R.served}</span> · <span class="money">${money(S.cash)}</span> <button class="link" style="float:right" id="pause">Ⅱ Tạm dừng</button></div><div class="orderlist" id="orderlist">${R.orders.map(x=>`<button class="customer ${x.id===R.focus?'active':''}" data-focus="${x.id}"><div class="who">${icon('people',x.face,'tiny')} ${x.name}</div><div class="want">${ITEMS[x.k].n} • ${money(S.prices[x.k])}</div><div class="bar"><i data-bar="${x.id}" style="width:${x.time/x.max*100}%"></i></div><small>Còn ${Math.ceil(x.time)} giây</small></button>`).join('')||'<div class="box">Khách sắp ghé quán…</div>'}</div><div class="station"><h3>🍗 QUẦY GÀ & BƠ DỪA 🥑</h3><div class="box">${say}</div>${main}</div><div class="box"><small>Mẹo: làm đúng món, chiên không cháy và giao trước khi khách hết kiên nhẫn để nhận 5 sao. Hàng tươi để qua ngày có thể hết hạn.</small></div></div>`}
function renderSell(){if(R.mode!=='sell')return;header();$('#view').innerHTML=contentSell();updateProgress()}
function updateProgress(){const el=$('#prog');if(el&&R.cup)el.style.width=Math.min(100,Math.round(R.cup.quality*100))+'%'}
function startItem(k){if(R.cup.item){tip('Hãy giao hoặc đổ bỏ món đang làm!');return}if(!have(k)){tip('Thiếu: '+missing(k).join(', '));return}Object.entries(ITEMS[k].need).forEach(([x,n])=>take(x,n));R.cup={item:k,step:0,quality:0,ingUsed:true};save();renderSell()}
function fryStart(e){if(!R.cup.item||!isFood(R.cup.item)||R.cup.step>=2)return;e.preventDefault();R.frying=true;try{e.currentTarget.setPointerCapture(e.pointerId)}catch{}}
function fryStop(){if(!R.frying)return;R.frying=false;R.cup.step=2;R.cup.quality=R.cup.quality>=.7&&R.cup.quality<=.9?R.cup.quality:Math.min(1,R.cup.quality);renderSell();tip(R.cup.quality>=.7&&R.cup.quality<=.9?'Gà vàng giòn vừa tới!':'Chiên chưa tới hoặc hơi cháy; có thể đổ bỏ làm lại.')}
$('#view').addEventListener('pointerdown',e=>{const b=e.target.closest('#fry');if(b)fryStart(e)});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>$('#view').addEventListener(ev,e=>{if(e.target.closest('#fry'))fryStop()}));
$('#view').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||R.mode!=='sell')return;let d=b.dataset;if(d.focus){R.focus=Number(d.focus);renderSell()}else if(d.start)startItem(d.start);else if(d.mix){if(!R.cup.item||isFood(R.cup.item))return;const step=+d.mix;if(step>R.cup.step+1){tip('Xay / rót trước khi thêm đá.');return}R.cup.step=Math.max(R.cup.step,step);R.cup.quality=step===1?.75:.82;renderSell()}else if(b.id==='serve')serve();else if(b.id==='trash'){R.cup={item:null,step:0,quality:0};R.frying=false;renderSell();tip('Đã bỏ món, nguyên liệu không được hoàn lại.')}else if(b.id==='pause')pause()});
function record(stars,text,o){S.reviews.unshift({stars,text,name:o.name,face:o.face,day:S.day});if(S.reviews.length>200)S.reviews.length=200}
function serve(){const o=target(),c=R.cup;if(!o){tip('Chưa có khách để giao món.');return}if(!c.item){tip('Hãy chọn món cần chế biến.');return}if(c.step<2){tip(isFood(c.item)?'Cần nhấn giữ để chiên trước khi giao.':'Cần xay / rót và thêm đá / đóng nắp trước khi giao.');return}const correct=c.item===o.k;const quality=isFood(c.item)?c.quality>=.7&&c.quality<=.9:true;
 if(!correct){record(2,'Mình đặt '+ITEMS[o.k].n+' nhưng nhận nhầm món khác.',o);R.cup={item:null,step:0,quality:0};o.time=Math.max(4,o.time-12);R.focus=o.id;renderSell();tip('Sai món! Khách chờ thêm; nguyên liệu đã mất.');return}
 const priced=S.prices[o.k],st=quality?(o.time/o.max>.45?5:4):2;const finalStars=priced>ITEMS[o.k].p*1.3?Math.max(1,st-1):st;S.cash+=priced;R.sales+=priced;R.served++;record(finalStars,finalStars>=4?`${ITEMS[o.k].n} ngon, phục vụ dễ thương!`:isFood(o.k)?'Gà chưa vừa độ giòn, mong quán chú ý hơn.':'Nước chưa đúng ý mình.',o);R.orders=R.orders.filter(x=>x.id!==o.id);R.focus=R.orders[0]?.id||null;R.cup={item:null,step:0,quality:0};save();renderSell();tip(`Đã giao ${ITEMS[o.k].n} · +${money(priced)} · ${finalStars}★`)}
function loop(){if(R.mode!=='sell'||R.paused)return;const now=performance.now();let dt=Math.min(.35,(now-R.last)/1000);R.last=now;R.seconds-=dt;R.spawn-=dt;if(R.frying&&R.cup.item){R.cup.quality=Math.min(1,R.cup.quality+dt/(ITEMS[R.cup.item].t*(S.upgrades.includes('fryer')?.65:1)));updateProgress();if(R.cup.quality>=1)fryStop()}
 if(R.spawn<=0&&R.seconds>0&&R.orders.length<3){newOrder();R.spawn=S.upgrades.includes('sign')?6.5:9}
 for(const o of [...R.orders]){o.time-=dt;if(o.time<=0){record(1,'Mình chờ lâu quá nên đành đi quán khác.',o);R.lost++;R.orders=R.orders.filter(x=>x!==o);if(R.focus===o.id)R.focus=R.orders[0]?.id||null;renderSell();tip(o.name+' đã bỏ về.')}}
 $('#clock')&&($('#clock').textContent=timeText());for(const o of R.orders){let i=$(`[data-bar="${o.id}"]`);if(i)i.style.width=Math.max(0,o.time/o.max*100)+'%'}
 if(R.seconds<=0&&R.orders.length===0){endDay()}}
function endDay(){if(R.mode!=='sell')return;clearInterval(R.interval);R.interval=null;R.frying=false;R.orders=[];R.focus=null;const today=S.day;let expired=0;KEYS.forEach(k=>{S.stock[k]=S.stock[k].filter(b=>{if(b.exp<=today){expired+=b.q;return false}return true})});const fixed=45000,profit=R.sales-R.spent-fixed;S.cash-=fixed;S.history.push({day:today,sales:R.sales,spent:R.spent,fixed,profit,waste:expired,served:R.served,lost:R.lost});S.day++;save();R.mode='summary';header();modal(`<h1>🌙 Hết ngày ${today}</h1><p>Đã bán <b>${R.served}</b> món · <b>${R.lost}</b> khách bỏ về</p><div class="box">Doanh thu: <b class="money">+${money(R.sales)}</b><br>Nhập hàng: −${money(R.spent)}<br>Mặt bằng + điện nước: −${money(fixed)}<br>Hàng hết hạn: ${expired} phần<hr>Lãi trong ngày: <b>${money(profit)}</b><br>Tiền trong két: <b>${money(S.cash)}</b></div><button class="big" id="next">Chuẩn bị ngày ${S.day}</button>`);$('#next').onclick=()=>{hideModal();R.spent=0;R.plan={};R.tab='Kho';renderPrep()}}
function pause(){R.paused=true;modal(`<h1>⏸ Tạm dừng</h1><p>Khách và đồng hồ sẽ dừng trong lúc xem màn hình này.</p><button id="resume" class="big alt">▶ Chơi tiếp</button><button id="endearly" class="big warn">Đóng cửa hôm nay</button>`);$('#resume').onclick=hideModal;$('#endearly').onclick=()=>{modal('<h1>Đóng cửa sớm?</h1><p>Khách đang chờ sẽ bỏ về. Quán chuyển sang tổng kết ngày.</p><button class="big warn" id="confirmEnd">Đóng cửa</button><button class="big alt" id="back">Quay lại</button>');$('#confirmEnd').onclick=()=>{R.lost+=R.orders.length;R.seconds=0;endDay()};$('#back').onclick=pause}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&R.mode==='sell'&&!R.paused)pause()});
function intro(){modal(`<div>${icon('menu',0,'large')} ${icon('menu',8,'large')} ${icon('menu',10,'large')}</div><h1>Tiệm Gà Rán<br>& Bơ Già Dừa Non</h1><p>Nhập hàng → mở cửa → chạm món → chiên hoặc xay → giao đúng khách. Đừng để khách hết kiên nhẫn!</p><p class="info">Bản demo học tập: 5 atlas SVG, 15 icon/atlas; đồ họa tự vẽ và trò chơi lưu trên trình duyệt.</p><button class="big" id="begin">Bắt đầu chơi</button>`);$('#begin').onclick=hideModal}
renderPrep();intro();
</script></body></html>
